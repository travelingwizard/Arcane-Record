server {
    listen 80;
    server_name character.travelingwizard.net;

    root /opt/arcane-ledger/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
