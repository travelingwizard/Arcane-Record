server {
    listen 80;
    server_name character.travelingwizard.net;

    location /.well-known/acme-challenge/ {
        root /opt/arcane-ledger/current;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name character.travelingwizard.net;

    root /opt/arcane-ledger/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/character.travelingwizard.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/character.travelingwizard.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
